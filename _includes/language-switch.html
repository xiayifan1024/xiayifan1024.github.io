{% assign locale = page.locale | default: site.locale %}
<nav class="language-switch" aria-label="{{ site.data.site-text[locale].language_label }}">
  <a href="{{ '/zh/' | relative_url }}" lang="zh-CN" hreflang="zh-CN"{% if locale == 'zh-CN' %} aria-current="page"{% endif %}>中文</a>
  <span aria-hidden="true"> / </span>
  <a href="{{ '/' | relative_url }}" lang="en" hreflang="en"{% if locale == 'en' %} aria-current="page"{% endif %}>English</a>
</nav>
